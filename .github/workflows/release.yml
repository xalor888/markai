name: Build & Release

# 触发方式：
# 1. 推送 v 开头 tag（如 v0.2.0）：git tag v0.2.0 && git push --tags
# 2. 手动：Actions 页 → Build & Release → Run workflow
on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - name: 安装依赖
        run: npm ci

      - name: 类型检查
        run: npm run compile

      - name: 运行测试
        run: npm test

      - name: 构建 Chrome / Edge 扩展
        run: npm run build

      - name: 打包 Chrome zip
        run: npm run zip

      - name: 打包 Firefox zip
        run: npm run zip:firefox

      - name: 上传构建产物
        uses: actions/upload-artifact@v5
        with:
          name: markai-build
          path: |
            .output/*.zip
            .output/chrome-mv3/
          retention-days: 14

      # tag 触发时发布 GitHub Release；手动触发同样发布（用 package.json 版本号）
      - name: 创建 GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: .output/*.zip
          generate_release_notes: true
