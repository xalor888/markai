name: Build & Release

# 触发方式：
# 1. 推送 v 开头 tag（如 v0.2.0）：git tag v0.2.0 && git push --tags
# 2. 手动：Actions 页 → Build & Release → Run workflow
on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - name: 安装依赖
        run: npm ci

      - name: 类型检查
        run: npm run compile

      - name: 运行测试
        run: npm test

      - name: 构建 Chrome / Edge 扩展
        run: npm run build

      - name: 打包 Chrome zip
        run: npm run zip

      # 不再发布 Firefox 产物：它从未在真实 Firefox 里验证过（见 docs/release.md）。
      # 重新纳入的条件写在同处：先在 Firefox 里装一次并跑通核心路径，再加回这一步。

      - name: 上传构建产物
        uses: actions/upload-artifact@v5
        with:
          name: markai-build
          path: .output/*.zip
          # 必须显式打开：`.output` 是隐藏目录，而 upload-artifact@v4.4+ / v5
          # 默认 include-hidden-files=false —— 于是这一步会「成功但什么都没上传」
          # （只在 run 的 ANNOTATIONS 里留一句 "No files were found"）。
          # v0.2.0 / v0.2.1 / v0.2.2 三次发版都中了这个坑，2026-09-14 修。
          include-hidden-files: true
          retention-days: 14

      # tag 触发时发布 GitHub Release；手动触发同样发布（用 package.json 版本号）
      - name: 创建 GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: .output/*.zip
          generate_release_notes: true
