<!DOCTYPE html>
<!-- onetake · MarkAI 15s teaser「一条线」 · concept: one indigo line carries every beat · © 2026 MarkAI -->
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<title>MarkAI · 一条线 (15s)</title>
<style>
/* look.js（look.py apply 生成）注入 var(--ground)…var(--accent2) 与三个字体变量；
   未加载时的回退值与 look.json 同源（MarkAI 深色 token）。 */
:root{
  --ground:#0e1116; --deep:#080a0d; --card:#151a21; --line:#262d38;
  --mute:#8c97a7; --ink:#e3e8ef; --accent:#6366f1; --accent2:#f97066;
  --success:#5fd08a;
  --display:'Geist',Inter,sans-serif; --text:Inter,'PingFang SC','Microsoft YaHei',sans-serif;
  --mono:'Geist Mono',monospace;
}
html,body{margin:0;width:1920px;height:1080px;overflow:hidden;background:var(--ground)}
body{font-family:var(--text);color:var(--ink);-webkit-font-smoothing:antialiased}
#stage{position:absolute;inset:0;overflow:hidden;background:var(--ground)}
.abs{position:absolute;left:0;top:0;will-change:transform,opacity}
#lattice{position:absolute;inset:0}
#lineCv{position:absolute;inset:0}

/* ── 近景层：唯一携带相机矩阵的 DOM 容器。
   CSS 的 transform 围绕「布局位置+transform-origin」共轭生效——布局在 (0,0) 的元素
   共轭才是无操作（onetake 模板的 .abs 全在 (0,0) 就是这个原因）。所以这里用一个
   (0,0) 的包装层挂相机，子元素也全部挪到 (0,0)、世界坐标写进各自的 transform 串。 ── */
#near{position:absolute;left:0;top:0;transform-origin:0 0;will-change:transform}
#near>*{transform-origin:0 0}

/* ── 输入条（打字段）· 世界位 (620,482) ── */
#prompt{position:absolute;left:0;top:0;width:680px;height:76px;border-radius:14px;
  background:var(--card);border:1px solid var(--line);will-change:transform,opacity,filter;
  box-shadow:0 30px 70px -30px rgba(0,0,0,.55)}
#prompt .txt{position:absolute;left:34px;top:0;height:100%;display:flex;align-items:center;
  font-size:27px;color:var(--ink);white-space:pre;font-weight:450}
#prompt .send{position:absolute;right:16px;top:16px;width:44px;height:44px;border-radius:50%;
  background:var(--accent);opacity:0;will-change:transform,opacity}
#prompt .send:after{content:"";position:absolute;left:16px;top:14px;width:11px;height:11px;
  border-left:2.5px solid #fff;border-top:2.5px solid #fff;transform:rotate(45deg)}

/* ── 书签列表（局部组件）· 世界位 (640,274) ── */
#listWrap{position:absolute;left:0;top:0;width:640px;height:532px;will-change:transform,opacity}
.row{position:absolute;left:0;width:640px;height:56px;will-change:transform,opacity;transform-origin:50% 50%}
.row .fav{position:absolute;left:24px;top:13px;width:30px;height:30px;border-radius:9px;
  background:var(--mute);opacity:.28;will-change:opacity}
.row .fav b{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;
  font:600 15px var(--text);color:#fff;opacity:0;will-change:opacity}
.row .ti{position:absolute;left:74px;top:8px;width:470px;font-size:19px;font-weight:450;color:var(--ink);
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis;opacity:.38;will-change:opacity,color}
.row .dm{position:absolute;right:16px;top:20px;font:400 12.5px var(--mono);color:var(--mute);opacity:.4;will-change:opacity}
.row .dead{position:absolute;right:16px;top:15px;height:26px;padding:0 10px;border-radius:7px;
  background:rgba(249,112,102,.16);border:1px solid rgba(249,112,102,.45);
  font:500 13px var(--text);color:var(--accent2);line-height:24px;opacity:0;will-change:transform,opacity}

/* ── 删除确认卡 ── */
#delCard{position:absolute;left:0;top:0;width:470px;height:300px;border-radius:18px;
  background:var(--card);border:1px solid var(--line);will-change:transform,opacity,filter;
  box-shadow:0 40px 90px -30px rgba(0,0,0,.6);transform-origin:0 0}
#delCard h4{margin:24px 28px 0;font:600 22px var(--display);letter-spacing:-.01em;color:var(--ink)}
#delCard .sub{margin:6px 28px 0;font:400 14px var(--text);color:var(--mute)}
#delCard .it{margin:0 28px;padding:10px 0;border-top:1px solid var(--line);font-size:16px;color:var(--ink);
  display:flex;gap:12px;align-items:baseline}
#delCard .it:first-of-type{margin-top:16px}
#delCard .it i{font:400 12.5px var(--mono);color:var(--mute);font-style:normal}
#delCard .it s{color:var(--accent2);text-decoration-thickness:1.5px}
#delCard .btns{position:absolute;left:0;right:0;bottom:20px;display:flex;justify-content:flex-end;gap:12px;padding:0 28px}
#delCard .btn{height:44px;padding:0 22px;border-radius:10px;font:500 16px var(--text);line-height:44px}
#delCard .btn.ghost{color:var(--mute)}
#delCard .btn.danger{background:var(--accent2);color:#fff;will-change:transform,background-color}

/* ── 光标（线的尾端具象）── */
#cursor{position:absolute;left:0;top:0;width:34px;height:44px;will-change:transform,opacity;
  filter:drop-shadow(0 2px 6px rgba(0,0,0,.45));transform-origin:0 0}

/* ── wordmark / tagline ── */
#mark{position:absolute;left:0;right:0;top:436px;text-align:center;white-space:nowrap;
  font:600 148px var(--display);letter-spacing:-.035em;color:var(--ink);will-change:opacity}
#mark span{display:inline-block;transform-origin:50% 88%;will-change:transform,opacity}
#mark .ai{color:var(--accent)}
#tag{position:absolute;left:0;right:0;top:626px;text-align:center;font:450 32px var(--text);
  color:var(--mute);letter-spacing:.02em;white-space:nowrap;will-change:transform,opacity}
#tag .cdot{display:inline-block;width:9px;height:9px;border-radius:50%;background:var(--accent);vertical-align:baseline;margin-left:2px;opacity:0.25}
#sub{position:absolute;left:0;right:0;top:706px;text-align:center;font:400 16px var(--mono);
  color:var(--mute);opacity:0;will-change:opacity}

#hud{position:absolute;right:14px;bottom:10px;font:13px var(--mono);color:#f0f;display:none}
</style>
</head>
<body>
<div id="stage">
  <canvas id="lattice" width="1920" height="1080"></canvas>
  <div id="near">
    <div id="prompt"><div class="txt"><span id="ptxt"></span></div><div class="send" id="send"></div></div>
    <div id="listWrap"></div>
    <div id="delCard">
      <h4>删除 3 个失效书签？</h4>
      <div class="sub">Agent 已逐条核验 · 可撤销</div>
      <div class="it"><s>CSS-Tricks</s><i>css-tricks.com</i></div>
      <div class="it"><s>2023 年度总结 — 旧博客</s><i>oldblog.cn</i></div>
      <div class="it"><s>前端进阶笔记</s><i>fe-notes.io</i></div>
      <div class="btns"><div class="btn ghost">取消</div><div class="btn danger" id="delBtn">删除</div></div>
    </div>
    <svg id="cursor" viewBox="0 0 34 44"><path d="M4 3 L30 22 L18 24 L26 40 L20 43 L12 27 L4 36 Z" fill="var(--ink)" stroke="var(--ground)" stroke-width="2.5" stroke-linejoin="round"/></svg>
  </div>
  <canvas id="lineCv" width="1920" height="1080"></canvas>
  <div id="mark" class="abs"></div>
  <div id="tag" class="abs">你的书签，交给我<span class="cdot" id="cdot"></span></div>
  <div id="sub" class="abs">github.com/xalor888/markai</div>
  <div id="hud"></div>
</div>
<script src="look.js"></script>
<script src="motion.js"></script>
<script>
// ════════════════════════════════════════════════════════════════════════════════════
// 「一条线」— one indigo line carries every beat.
//   BREATH → CARET(打字) → SEND → DROP → SCAN(点亮/标红) → COIL(盘圈) → CARD(确认卡+点击)
//   → CHECK(对勾一笔) → BURST(死链裂开·gap 闭合) → REST(近静止) → FLY(飞向句号) → END
// Everything is a pure function of t. No Math.random on the render path.
// 线的全部形态都是「同一根线」：呼吸的横线 → 竖成 caret → 落成扫描线 → 盘成圈 →
// 收成点（尾端具象成光标去点确认）→ 收笔成对勾 → 在列表底端歇息 → 飞向句号 → 落成那一点。
// ════════════════════════════════════════════════════════════════════════════════════
const FPS=30, DUR=15;
window.__meta={dur:DUR,fps:FPS,w:1920,h:1080,inFrame:{'div:mark':[12.07,DUR],'div:tag':[12.67,DUR]}};

// ── beats ──
const BREATH=[0.00,1.30], CARET=[1.30,2.70], SEND=[2.70,3.15];
const DROP_T=2.80, DROP_LAND=3.62;               // 线在输入条飞出的同时射出（不留空场）
const SCAN=[3.70,6.05];
const COIL=[6.35,7.02];
const CARD_T=7.06, CLICK_T=8.32, CARD_OUT=8.85;
const CHECK_T=8.88;
const BURST=[9.42,9.60,9.78];
const REST=[9.95,11.62];
const FLY=[11.65,12.85], MARK_T=12.02, TAG_T=12.62, SUB_T=13.10;
const END_T=12.95;

// ── layout ──
const L={x:640,w:640,rowH:56,gap:12,top:274};
const LIST_B=L.top+8*L.rowH+7*L.gap;          // 806
const PROMPT={x:620,y:482,w:680,h:76};
const ROW_Y=i=>L.top+i*(L.rowH+L.gap);
const SURV=[0,1,2,4,6], DEAD_AFTER=[3,5,7];
const CX=1175, CY=570;                          // 圈心 = 删除卡中心，卡从圈点长出
const RESTY=646;                                 // 压缩后列表（5 行，底 602）下方的歇息位
const TAGDOT={x:1240,y:648};                    // 句号点（__ready 后实测修正）

const ROWS=[
  {t:'GitHub - xalor888/markai', d:'github.com',            c:'#e3e8ef', ok:1},
  {t:'MDN Web Docs',             d:'developer.mozilla.org', c:'#6b9fff', ok:1},
  {t:'Chrome for Developers',    d:'developer.chrome.com',  c:'#68c07a', ok:1},
  {t:'2023 年度总结 — 旧博客',  d:'oldblog.cn',            c:'',        ok:0},
  {t:'Hacker News',              d:'news.ycombinator.com',  c:'#ff9c5b', ok:1},
  {t:'CSS-Tricks',               d:'css-tricks.com',        c:'',        ok:0},
  {t:'npm · markai',             d:'npmjs.com',             c:'#f4c64f', ok:1},
  {t:'前端进阶笔记',            d:'fe-notes.io',           c:'',        ok:0},
];
const PROMPT_TEXT='帮我清理失效书签';

// ── OM ──
const {clamp,lerp,seg,ease}=OM;

// ── DOM ──
const $=id=>document.getElementById(id);
const rowEls=ROWS.map((r,i)=>{
  const d=document.createElement('div'); d.className='row'; d.style.top=(i*(L.rowH+L.gap))+'px';
  const first=r.ok?((r.t.replace(/[^a-zA-Z\u4e00-\u9fa5]/g,'')[0])||'M'):'';
  d.innerHTML=`<div class="fav" ${r.ok?`style="background:${r.c}"`:''}><b>${first}</b></div>
    <div class="ti">${r.t}</div><div class="dm">${r.d}</div><div class="dead">失效</div>`;
  $('listWrap').appendChild(d); return d;
});
const favBox=rowEls.map(e=>e.querySelector('.fav'));
const favLetter=rowEls.map(e=>e.querySelector('.fav b'));
const tiEl=rowEls.map(e=>e.querySelector('.ti'));
const dmEl=rowEls.map(e=>e.querySelector('.dm'));
const deadEl=rowEls.map(e=>e.querySelector('.dead'));
const markEl=$('mark');
const MARKL=[...'MarkAI'].map((ch,i)=>{const s=document.createElement('span');s.textContent=ch;
  if(i>=4)s.className='ai';markEl.appendChild(s);return s;});

// ── 扫描时刻（几何反解：线性 y 对线性 t）──
const scanY=t=>lerp(L.top-26,LIST_B+26,clamp(seg(t,SCAN[0],SCAN[1]),0,1));
const rowHitY=i=>ROW_Y(i)+L.rowH/2;
const HITS=ROWS.map((_,i)=>SCAN[0]+(rowHitY(i)-(L.top-26))/(LIST_B+26-(L.top-26))*(SCAN[1]-SCAN[0]));

// ── 相机：落点提前 key；手 float；落地 shake ──
const CAMK=[
  {t:0.00,x:960,y:540,zoom:1.000},
  {t:1.20,x:960,y:522,zoom:1.045},
  {t:2.62,x:962,y:516,zoom:1.060},
  {t:3.05,x:960,y:540,zoom:1.000,curve:ease.expoInOut},
  {t:3.58,x:960,y:318,zoom:1.095},
  {t:4.90,x:960,y:430,zoom:1.100},
  {t:6.20,x:1010,y:590,zoom:1.105},
  {t:7.02,x:1175,y:570,zoom:1.150},
  {t:8.30,x:1150,y:565,zoom:1.155},
  {t:9.28,x:960,y:540,zoom:1.000,curve:ease.expoInOut},
  {t:9.95,x:960,y:540,zoom:1.020},
  {t:11.60,x:960,y:540,zoom:1.000},
  {t:15.0,x:960,y:540,zoom:1.000},
];
const SHAKES=[[DROP_LAND,7],[CARD_T+0.06,9],[BURST[0]+0.02,8],[BURST[1]+0.02,7],[BURST[2]+0.02,7]];
function camAt(t){
  const c=OM.camera(t,CAMK);
  const alive=t>1?1:0.4;
  const fx=Math.sin(t*0.7)*6*alive, fy=Math.cos(t*0.55)*4*alive;
  let sx=0,sy=0,rot=0;
  for(const [th,amp] of SHAKES){ const s=OM.shake(t,th,{amp}); sx+=s.x; sy+=s.y; rot+=s.rot; }
  return {x:c.x+fx+sx, y:c.y+fy+sy, zoom:c.zoom, rot:c.rot+rot};
}

// ── 画布 ──
const gCtx=$('lattice').getContext('2d');
const ctx=$('lineCv').getContext('2d');
const COL={accent:'#6366f1',accent2:'#f97066',success:'#5fd08a',line:'#262d38'};
function drawLattice(cam,op){
  gCtx.setTransform(1,0,0,1,0,0); gCtx.clearRect(0,0,1920,1080);
  if(op<=0.01) return;
  const g=OM.lattice(cam,{depth:1.2,spacing:64,px:1.5});
  gCtx.setTransform(...g.matrix); gCtx.globalAlpha=op; gCtx.fillStyle=COL.line;
  for(let x=g.x0;x<=g.x1;x+=g.spacing) for(let y=g.y0;y<=g.y1;y+=g.spacing){
    gCtx.beginPath(); gCtx.arc(x,y,g.r,0,Math.PI*2); gCtx.fill();
  }
  gCtx.globalAlpha=1;
}
function strokeSegs(segs,w,col,op,glow){
  if(op<=0.01) return;
  ctx.save(); ctx.lineCap='round'; ctx.lineJoin='round'; ctx.lineWidth=w;
  ctx.strokeStyle=col; ctx.globalAlpha=op;
  if(glow){ ctx.shadowColor=col; ctx.shadowBlur=glow; }
  for(const s of segs){ if(s.length<2) continue;
    ctx.beginPath(); ctx.moveTo(s[0][0],s[0][1]);
    for(let i=1;i<s.length;i++) ctx.lineTo(s[i][0],s[i][1]);
    ctx.stroke();
  }
  ctx.restore();
}
function measureText(s){
  ctx.font='450 27px Inter, "PingFang SC", "Microsoft YaHei", sans-serif';
  return ctx.measureText(s).width;
}

// ── 线的形态：每个节拍给出 segs（互不连笔的段列表）──
// breath + caret：横线竖起滑入输入条，随后成为打字 caret
function lineEarly(t){
  if(t<CARET[0]){
    const w=lerp(8,84,clamp(t/BREATH[1]*1.4,0,1))*(0.9+0.1*Math.sin(t*2.1));
    const y=540+Math.sin(t*1.15)*7;
    return {segs:[[[960-w,y],[960+w,y]]], w:2.5, op:1, col:COL.accent};
  }
  const k=ease.expoInOut(clamp(seg(t,CARET[0],CARET[0]+0.5),0,1));
  const ty=OM.typeOn(t,CARET[0]+0.28,PROMPT_TEXT,{cps:15});
  const tx=654+measureText(ty.str);
  const cx=lerp(960,654,k), cy=lerp(540,520,k), h=lerp(0,17,k), w0=84*(1-k);
  const segs=[];
  if(w0>0.6) segs.push([[cx-w0,cy],[cx+w0,cy]]);
  if(h>0.6) segs.push([[tx,cy-h],[tx,cy+h]]);
  return {segs, w:2.5, op:1, col:COL.accent, caretBlink:ty.caret};
}
// drop / scan / coil / dot
function lineMid(t){
  if(t<SCAN[0]){                                     // 落下
    const k=ease.expoIn(clamp(seg(t,DROP_T,DROP_LAND),0,1));
    const y=lerp(-40,L.top-26,k), w=lerp(150,126,k);
    return {segs:[[[960-w,y],[960+w,y]]], w:3, op:1, col:COL.accent};
  }
  if(t<COIL[0]){                                     // 扫描
    const y=scanY(t);
    return {segs:[[[834,y],[1086,y]]], w:3, op:1, col:COL.accent};
  }
  const startY=scanY(COIL[0]);                       // = LIST_B+26
  if(t<COIL[1]){                                     // 盘圈：从扫描线右端卷向圈心（大半径螺旋，套住死链组）
    const r0=150, a0=-Math.PI/2;                     // 从圈顶起卷，顺时针 2 圈收到 10px
    const pts=[[1086,startY]];
    const segsN=160;
    for(let i=0;i<=segsN;i++){
      const e=ease.smoother(i/segsN);
      if(e<0.32){ const q=e/0.32;                    // 弧线段：扫描尾 → 圈缘（圈顶）
        const bx=lerp(1086,CX+40,q), by=lerp(startY,CY-r0,q);
        pts.push([bx+Math.sin(q*2.6)*14, by-Math.sin(q*Math.PI)*60]);
      } else { const q=(e-0.32)/0.68;                // 螺旋段
        const ang=a0+q*Math.PI*4, r=lerp(r0,10,ease.smoother(q));
        pts.push([CX+Math.cos(ang)*r, CY+Math.sin(ang)*r*0.92]);
      }
    }
    return {segs:[pts], w:3, op:1, col:COL.accent};
  }
  // 圈收成的点：脉冲到卡片弹出，然后淡出（卡片接管画面）
  const fade=1-clamp(seg(t,COIL[1]+0.30,COIL[1]+0.58),0,1);
  let r=lerp(7,4,clamp(seg(t,COIL[1],COIL[1]+0.3),0,1));
  if(t>CLICK_T) r+=OM.ring(t-CLICK_T,8,20)*2;
  return {segs:[], w:3, op:1, col:COL.accent, dot:r*1.7, dotOp:fade};
}
// check：绿对勾一笔（画在卡片原来的位置上——卡片收走、对勾接管）
function checkSegs(p){
  if(p<=0) return [];
  const A=[1120,560],B=[1152,596],C=[1226,512];
  const l1=Math.hypot(B[0]-A[0],B[1]-A[1]), l2=Math.hypot(C[0]-B[0],C[1]-B[1]), LT=l1+l2;
  const d1=LT*p, out=[[...A]];
  if(d1<=l1){ const u=d1/l1; out.push([lerp(A[0],B[0],u),lerp(A[1],B[1],u)]); }
  else{ out.push([...B]); const u=clamp((d1-l1)/l2,0,1); out.push([lerp(B[0],C[0],u),lerp(B[1],C[1],u)]); }
  return [out];
}
// rest / fly
function restLine(t){
  const w=44*(0.9+0.1*Math.sin(t*1.4));
  const y=RESTY+Math.sin(t*0.9)*5;
  return {segs:[[[960-w,y],[960+w,y]]], w:2.5, op:1, col:COL.accent};
}
function flyLine(t){
  const k=ease.expoInOut(clamp(seg(t,FLY[0],FLY[1]),0,1));
  const x=lerp(960,TAGDOT.x-4,k), y=lerp(RESTY,TAGDOT.y-1,k)-Math.sin(k*Math.PI)*120;
  const w=lerp(60,2,k)*(0.85+0.15*Math.sin(t*3));
  return {segs:[[[x-w,y],[x+w,y]]], w:3, op:1, col:COL.accent};
}

// ── seek ──
function seek(t){
  const cam=camAt(t);
  const M=OM.view(cam,{W:1920,H:1080,depth:0});
  const mstr=`matrix(${M.map(n=>n.toFixed(5)).join(',')})`;
  drawLattice(cam, t<0.4? t/0.4*0.9 : (t>END_T?0.55:0.9));
  // 近景层：唯一的相机载体（#near 在 (0,0) → 共轭无操作；子元素世界位自带在各自 transform 里）
  const nearEl=$('near');
  nearEl.style.transformOrigin='0 0';
  nearEl.style.transform=mstr;
  // 线的画布也在 (0,0)，但默认 origin 是 50% 50% —— 必须显式归零
  const lc=$('lineCv');
  lc.style.transformOrigin='0 0';
  lc.style.transform=mstr;

  // 1 · 输入条
  {
    const el=$('prompt'), vis=t>=1.32&&t<3.32;
    if(vis){
      const inK=OM.popIn(t,1.32,{zeta:0.7,omega:17,rise:26});
      const fly=clamp(seg(t,SEND[0],SEND[0]+0.24),0,1);
      const sq=1-0.24*ease.expoIn(fly);
      el.style.opacity=inK.op*(1-fly);
      el.style.transform=`translate(620px,482px) translateY(${(inK.dy-fly*130).toFixed(1)}px) scaleY(${(inK.s*sq).toFixed(4)}) scaleX(${(inK.s*(1+0.10*fly)).toFixed(4)})`;
      el.style.filter=inK.op<1?`blur(${((1-inK.op)*6).toFixed(1)}px)`:'none';
      const ty=OM.typeOn(t,CARET[0]+0.28,PROMPT_TEXT,{cps:15});
      $('ptxt').textContent=ty.str;
      const p=OM.press(t,SEND[0]+0.06,{depth:0.3});
      $('send').style.opacity=clamp(seg(t,CARET[0]+0.9,SEND[0]-0.05),0,1)*(1-clamp(seg(t,SEND[0]+0.1,SEND[0]+0.2),0,1));
      $('send').style.transform=`scale(${p.s.toFixed(3)})`;
    } else el.style.opacity=0;
  }
  // 2 · 列表
  {
    const wrap=$('listWrap'), vis=t>=2.98;
    if(vis){
      const mk=ease.expoOut(clamp(seg(t,3.02,3.55),0,1));
      wrap.style.opacity=0.2+0.8*mk;
      wrap.style.transform=`translate(${L.x}px,${L.top}px) translate(${(lerp(PROMPT.x,L.x,mk)-L.x).toFixed(1)}px,${(lerp(PROMPT.y,L.top,mk)-L.top).toFixed(1)}px) scale(${(lerp(PROMPT.w,L.w,mk)/L.w).toFixed(4)},${(lerp(PROMPT.h,532,mk)/532).toFixed(4)})`;
      rowEls.forEach((el,i)=>{
        const born=3.30+i*0.075;
        const r=OM.maskRise(t,born,0,{zeta:0.6,omega:19,dist:1});
        const di=DEAD_AFTER.indexOf(i);
        // END 前退场：首行滞后到 12.4（与 wordmark 交叠出真实 carry），其余随线起飞
        const exitRow=1-clamp(seg(t,11.95,12.60),0,1);   // 全体随飞线起飞一同退场
        if(di>=0){                                    // 死行：burst 时裂开塌缩
          const collapse=ease.expoIn(clamp(seg(t,BURST[di],BURST[di]+0.26),0,1));
          const sp=OM.impactSplit(t,BURST[di],960,960,{width:900,spread:26,bounce:20,rot:0.05});
          el.style.opacity=(1-collapse)*r.k*exitRow;
          el.style.transform=`translate(${sp.dx.toFixed(1)}px,${sp.dy.toFixed(1)}px) scale(${(1-collapse*0.4).toFixed(3)},${(1-collapse).toFixed(3)})`;
        } else if(t>BURST[0]){                        // 幸存行：它上方的每个死行塌缩时，gap 因果地闭合
          let dy=0;
          for(const d of DEAD_AFTER) if(d<i) dy-=(L.rowH+L.gap)*ease.expoOut(clamp(seg(t,BURST[DEAD_AFTER.indexOf(d)]+0.05,BURST[DEAD_AFTER.indexOf(d)]+0.65),0,1));
          el.style.opacity=r.k*exitRow; el.style.transform=`translateY(${(dy-exitRow*150).toFixed(1)}px)`;
        } else { el.style.opacity=r.k*exitRow; el.style.transform=`translateY(${(-exitRow*150).toFixed(1)}px)`; }
        // 扫描点亮 / 标红
        const hit=HITS[i];
        if(t>hit){
          const lk=clamp(seg(t,hit,hit+0.22),0,1);
          if(ROWS[i].ok){
            favBox[i].style.opacity=0.28+0.72*lk;
            favLetter[i].style.opacity=lk;
            tiEl[i].style.opacity=0.38+0.62*lk;
            dmEl[i].style.opacity=0.4+0.6*lk;
          } else {
            tiEl[i].style.color='var(--accent2)';
            tiEl[i].style.opacity=0.38+0.62*lk;
            const dk=OM.popIn(t,hit+0.10,{zeta:0.6,omega:22,rise:10,s0:0.8,ds:0.2});
            deadEl[i].style.opacity=dk.op; deadEl[i].style.transform=`scale(${dk.s.toFixed(3)})`;
            dmEl[i].style.opacity=0;
          }
        }
      });
    } else wrap.style.opacity=0;
  }
  // 3 · 删除卡：从圈心点长出（显式做「围绕世界点缩放」，不用 transform-origin——
  //     origin 会平移整条变换链、破坏相机矩阵的对位）
  {
    const el=$('delCard'), vis=t>=CARD_T&&t<CARD_OUT+0.25;
    if(vis){
      const inK=OM.popIn(t,CARD_T,{zeta:0.62,omega:15,rise:20,s0:0.55,ds:0.45});
      const outK=1-ease.expoIn(clamp(seg(t,CARD_OUT-0.06,CARD_OUT+0.14),0,1));
      const p=OM.press(t,CLICK_T,{depth:0.05});
      const s=inK.s*outK*p.s;
      el.style.opacity=inK.op*outK;
      el.style.transform=`translate(940px,420px) translate(${CX-940}px,${CY-420}px) scale(${s.toFixed(4)}) translate(${-(CX-940)}px,${-(CY-420)}px)`;
    } else el.style.opacity=0;
    const bp=OM.press(t,CLICK_T);
    $('delBtn').style.transform=`scale(${bp.s.toFixed(3)})`;
    $('delBtn').style.background=bp.active?'var(--success)':'var(--accent2)';
  }
  // 4 · 光标（线的尾端）：滑到「删除」按钮并点击
  {
    const el=$('cursor');
    const DEL={x:1337,y:678};                          // 删除按钮中心
    const K=[{t:CARD_T+0.35,x:1520,y:430},{t:8.18,x:DEL.x,y:DEL.y},{t:CLICK_T+0.01,x:DEL.x,y:DEL.y},{t:8.75,x:DEL.x+40,y:DEL.y+46}];
    const vis=t>=CARD_T+0.3&&t<8.98;
    const cu=OM.cursor(t,K,[CLICK_T]);
    el.style.opacity=vis?1:0;
    el.style.transform=`translate(${(cu.x-5).toFixed(1)}px,${(cu.y-3).toFixed(1)}px) scale(${(cu.s*0.9).toFixed(3)})`;
  }
  // 5 · wordmark / tagline / sub
  {
    MARKL.forEach((s,i)=>{ const d=OM.letterDrop(t,MARK_T,i,{stagger:0.055,squash:0.006,max:0.2});
      s.style.opacity=d.op; s.style.transform=`translateY(${d.y.toFixed(1)}px) scale(${(1+d.sq*0.6).toFixed(4)},${(1-d.sq).toFixed(4)})`; });
    markEl.style.opacity=t>=MARK_T?1:0;
    const tg=OM.wordRise(t,TAG_T,{zeta:0.6,omega:20,dist:22});
    $('tag').style.opacity=t>=TAG_T?tg.op:0;
    $('tag').style.transform=`translateY(${tg.y.toFixed(1)}px)`;
    $('sub').style.opacity=clamp(seg(t,SUB_T,SUB_T+0.5),0,1)*0.85;
    // 句号点：12.35 起随飞线一同到达，此后一直是画面里的元素（线的 DOM 化身）
    const dotTake=clamp(seg(t,12.35,12.90),0,1);
    $('cdot').style.opacity=0.18+0.82*dotTake;
  }
  // 6 · 线
  {
    ctx.setTransform(1,0,0,1,0,0); ctx.clearRect(0,0,1920,1080);
    let S=null;
    if(t<SEND[0]+0.18) S=lineEarly(t);
    else if(t<CHECK_T) S=lineMid(t);
    else if(t<REST[0]){                                    // check 段 + burst 淡出
      const p=ease.expoOut(clamp(seg(t,CHECK_T,CHECK_T+0.34),0,1));
      const fade=1-clamp(seg(t,BURST[0]-0.15,BURST[0]+0.1),0,1);
      S={segs:checkSegs(p), w:4.5, op:fade, col:COL.success};
    }
    else if(t<FLY[0]) S=restLine(t);
    else if(t<END_T+0.05) S=flyLine(t);
    if(t>=12.66){                                     // 片尾：线化为 wordmark 下的一条细线（同一根线的延续）
      const k=clamp(seg(t,12.66,13.25),0,1);
      const y0=lerp(RESTY+4,706,ease.smoother(k)), hw=lerp(44,290,ease.smoother(k));
      strokeSegs([[[960-hw,y0],[960+hw,y0]]],2,COL.accent,0.30*clamp(seg(t,12.66,13.05),0,1),8);
    }
    if(S){
      let op=S.op??1;
      if(t>=SEND[0]&&t<SEND[0]+0.18) op*=1-clamp(seg(t,SEND[0],SEND[0]+0.18),0,1);
      if(t>=CARET[0]&&t<SEND[0]&&S.caretBlink!==undefined) op*=Math.max(S.caretBlink,0.25);
      if(t>=DROP_T-0.12&&t<DROP_T) op*=clamp(seg(t,DROP_T-0.12,DROP_T),0,1);
      strokeSegs(S.segs,S.w,S.col,op,10);
      if(S.dot&&S.dotOp>0.01){
        ctx.save(); ctx.fillStyle=COL.accent; ctx.globalAlpha=S.dotOp;
        ctx.shadowColor=COL.accent; ctx.shadowBlur=14;
        ctx.beginPath(); ctx.arc(CX,CY,S.dot,0,Math.PI*2); ctx.fill(); ctx.restore();
      }
    }

  }
  $('hud').textContent='t='+t.toFixed(3);
  return Promise.resolve();
}
window.__seek=async t=>{ await seek(t); return true; };
// 渲染快门：窗口内最大的屏幕位移（相机两深度层取大 + 线自身的行程余量）。
// 8.3→9.3 的 whip 相机峰值 ~1000+ px/帧，不报这个量 render 的快门采样不足会 banding。
window.__motion=(t0,t1)=>{
  const c0=camAt(t0), c1=camAt(t1), cm=camAt((t0+t1)/2);
  let d=OM.screenTravel(c0,c1,cm,{depth:0});
  d=Math.max(d,OM.screenTravel(c0,c1,cm,{depth:1.2}));
  return d+80;   // 线自身（盘圈尖端、对勾收笔、飞行）的行程余量
};
window.__events=()=>[
  {t:0.15,k:'sub'},{t:1.32,k:'air'},
  ...[0,1,2,3,4,5].map(i=>({t:1.70+i*0.12,k:'tick'})),
  {t:2.80,k:'swoosh'},{t:DROP_LAND,k:'impact'},{t:DROP_LAND+0.02,k:'thud'},
  ...[0,1,2,4,6].map((r,i)=>({t:HITS[r]+0.05,k:'tick'})),
  ...[3,5,7].map(r=>({t:HITS[r]+0.12,k:'glass',dt:-0.4})),
  {t:6.55,k:'silk'},{t:CARD_T+0.05,k:'thunk'},{t:CLICK_T,k:'click'},
  {t:CHECK_T+0.05,k:'glass',dt:0.6},
  ...BURST.map(b=>({t:b+0.02,k:'impact'})),
  {t:FLY[0]+0.08,k:'air'},
  ...[0,2,4].map(i=>({t:MARK_T+0.06+i*0.11,k:'tick'})),
  {t:END_T+0.1,k:'sub',dt:-0.5},
];
window.__ready=(window.LOOK?LOOK.ready:Promise.resolve(document.fonts?document.fonts.ready:Promise.resolve())).then(()=>{
  const d=$('cdot').getBoundingClientRect();
  TAGDOT.x=d.left+d.width/2; TAGDOT.y=d.top+d.height/2;
  return seek(0);
});
const q=new URLSearchParams(location.search);
if(q.has('t')) window.__ready.then(()=>seek(parseFloat(q.get('t'))));
if(q.has('hud')) $('hud').style.display='block';
if(q.has('play')) window.__ready.then(()=>{const t0=performance.now();(function loop(){seek(((performance.now()-t0)/1000)%DUR);requestAnimationFrame(loop);})();});
</script>
